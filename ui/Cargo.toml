[package]
name = "nixdash-ui"
version = "0.1.1"
edition = "2021"
# The repository is dual-licensed; both files ship in the packages below.
license = "MIT OR Apache-2.0"
description = "NixOS, Qt and Rust config and monitoring - desktop UI"
repository = "https://github.com/PieterdenEngelse/nixdash"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["full"] }

[build-dependencies]
cxx-qt-build = "0.10"

# ---------------------------------------------------------------------------
# Native Linux packages.
#
# Both live on the UI crate rather than the engine's because the package is
# the user-facing thing: it owns the desktop entry and the icon, and it pulls
# the engine in beside it. Paths are relative to this file, so ../ throughout.
#
# Neither can be built on the development machine. A .deb or .rpm must link
# against the distribution's own Qt and glibc; a build here links against
# /nix/store and glibc 2.42, which is newer than any mainstream distribution
# ships. Each package is therefore built inside its own distribution by
# .github/workflows/linux-packages.yml.
# ---------------------------------------------------------------------------

[package.metadata.deb]
name = "nixdash"
maintainer = "Pieter den Engelse <denengelse@gmail.com>"
copyright = "2026, Pieter den Engelse"
section = "utils"
priority = "optional"
extended-description = """\
Local-first config and monitoring for one machine: a Rust engine with a \
Qt/QML desktop UI, loopback only, no accounts and no telemetry. \
Monitors Qt and Rust build environments, and NixOS where there is one \
to monitor - off NixOS those panels report that they could not look \
rather than inventing a reading."""

# $auto is dpkg-shlibdeps, which reads the ELF and maps each .so back to the
# package owning it - so the libQt6* dependencies never need listing or
# updating here. What it cannot see are the QML modules: those are loaded by
# name at runtime through the QML engine, not linked, so the binary carries no
# trace of them and they have to be named by hand. qml/*.qml imports exactly
# QtQuick, QtQuick.Controls and QtQuick.Layouts; Controls additionally needs
# its Fusion style at runtime, which is the style ui/src/main.rs sets.
#
# The list is NOT just what the QML imports: QtQml.WorkerScript is here
# because QtQuick itself loads it, and `apt-cache depends qml6-module-qtquick`
# declares no such dependency on either Debian 12 or 13. Without it the window
# opens empty and the only sign is in the UI's own log:
#
#   QQmlApplicationEngine failed to load component
#   qrc:/qt/qml/nixdash/qml/Main.qml: module "QtQml.WorkerScript" is not installed
#
# Nothing in the build, the linker or dpkg objects. The only thing that
# catches it is the CI step that launches the installed UI under xvfb and
# greps its log, which is how this one was found. Expect to add to this list
# when a QML import changes, and expect that step to be the thing that tells
# you.
depends = "$auto, qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-templates, qml6-module-qtquick-window, qml6-module-qtqml-workerscript"

# The two binary paths have no ../ , unlike every other asset here, and that
# is not an oversight: cargo-deb only recognises a source path beginning with
# exactly "target/release/" as a Cargo artifact, and maps it to the workspace
# target directory itself. Writing ../target/release/ resolves to the same
# file but is treated as an opaque data file, which silently skips stripping
# and leaves ~2 MB of symbols in the package.
assets = [
    ["target/release/nixdash-ui", "usr/bin/", "755"],
    ["target/release/nixdash-engine", "usr/bin/", "755"],
    ["../packaging/linux/nixdash.desktop", "usr/share/applications/", "644"],
    ["../packaging/linux/nixdash-engine.service", "usr/lib/systemd/user/", "644"],
    ["../assets/nixdash.svg", "usr/share/icons/hicolor/scalable/apps/nixdash.svg", "644"],
    ["../README.md", "usr/share/doc/nixdash/", "644"],
    ["../LICENSE-MIT", "usr/share/doc/nixdash/", "644"],
    ["../LICENSE-APACHE", "usr/share/doc/nixdash/", "644"],
]

[package.metadata.generate-rpm]
name = "nixdash"
summary = "NixOS, Qt and Rust config and monitoring (loopback only)"
license = "MIT OR Apache-2.0"

# rpm's own find-requires, the equivalent of $auto above: it reads the ELF and
# emits a soname dependency per linked library. The QML modules are invisible
# to it for the same reason, and on Fedora all three live in one package.
#
# NOTE the asset paths below carry no ../ at all, where the cargo-deb section
# above needs it on everything but the binaries. The two tools resolve from
# different places: cargo-deb resolves relative to this manifest (ui/), while
# cargo generate-rpm resolves relative to the working directory, and CI runs
# it from the workspace root. Unlike the cargo-deb convention this one is
# unverified locally - cargo-generate-rpm is not in nixpkgs, so the rpm job
# is the first thing that ever executes it.
auto-req = "auto"

# An rpm RICH dependency, so the Qt requirement has an upper bound as well as
# a lower one - the same install-time refusal the deb variants give. A plain
# map cannot express a range, since TOML has no duplicate keys, and rpm's
# boolean syntax in the dependency NAME is the way round that.
[package.metadata.generate-rpm.requires]
"(qt6-qtdeclarative >= 6.8 with qt6-qtdeclarative < 6.9)" = "*"
qt6-qtsvg = "*"

# One variant per Qt minor, selected by `cargo deb --variant debian12`.
#
# These exist to turn a runtime failure into an install-time refusal. cxx-qt
# links Qt's private API, so a package built against 6.4.2 is only safe on the
# 6.4 line - but nothing stops a user installing it on 6.8, because
# Qt_6_PRIVATE_API is an unversioned tag that every Qt 6 provides and the
# versioned tags are forward-compatible. dpkg-shlibdeps gives a LOWER bound
# (libqt6qml6 >= 6.4.2) and no upper one, so apt sees nothing to object to and
# the user gets a window that misbehaves instead of a clear error.
#
# Capping libqt6qml6 is enough and is the targeted fix: libQt6Qml is the
# library whose private API the UI actually links against.
#
# The whole depends string is restated because a variant replaces the field
# rather than appending to it; keep these in step with the base above.
[package.metadata.deb.variants.debian12]
depends = "$auto, qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-templates, qml6-module-qtquick-window, qml6-module-qtqml-workerscript, libqt6qml6 (<< 6.5)"

[package.metadata.deb.variants.debian13]
depends = "$auto, qml6-module-qtquick, qml6-module-qtquick-controls, qml6-module-qtquick-layouts, qml6-module-qtquick-templates, qml6-module-qtquick-window, qml6-module-qtqml-workerscript, libqt6qml6 (<< 6.9)"

[[package.metadata.generate-rpm.assets]]
source = "target/release/nixdash-ui"
dest = "/usr/bin/nixdash-ui"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "target/release/nixdash-engine"
dest = "/usr/bin/nixdash-engine"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/nixdash.desktop"
dest = "/usr/share/applications/nixdash.desktop"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/linux/nixdash-engine.service"
dest = "/usr/lib/systemd/user/nixdash-engine.service"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "assets/nixdash.svg"
dest = "/usr/share/icons/hicolor/scalable/apps/nixdash.svg"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/nixdash/README.md"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE-MIT"
dest = "/usr/share/doc/nixdash/LICENSE-MIT"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "LICENSE-APACHE"
dest = "/usr/share/doc/nixdash/LICENSE-APACHE"
mode = "644"
