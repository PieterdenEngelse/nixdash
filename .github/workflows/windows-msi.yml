# Builds the Windows MSI.
#
# This exists because the MSI cannot be built on the development machine.
# nixdash is developed on NixOS, and pkgsCross.mingwW64.qt6.qtdeclarative is
# marked unsupported and does not even evaluate - so while the engine
# cross-compiles fine (`just engine-windows`), the Qt UI has no cross path at
# all. A Windows runner with an official Qt is the shortest way to a .exe, and
# it is also the only place WiX itself is supported: `wix build` runs on Linux
# but warns that all behaviour is undefined, and on a canonical four-line
# .wxs it rejects a plainly relative Directory/@Name. Verified 2026-10-28.
name: windows-msi

# For the release-asset upload at the end; nothing else here needs write.
permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # MSVC, not gnu: the official Qt binaries for Windows are MSVC-built,
      # and cxx-qt links Rust against them directly. Mixing a windows-gnu
      # Rust with an MSVC Qt does not link.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 6.8.3 (LTS), NOT the 6.11.2 this project develops against, and the
      # reason is a Qt repository change rather than a preference.
      #
      # Qt reorganised its online repository at 6.11: metadata moved from
      # .../qt6_6112/qt6_6112/Updates.xml to a per-architecture
      # .../qt6_6112/qt6_6112_msvc2022_64/Updates.xml. aqtinstall, which this
      # action drives, still looks for the nested form, so every 6.11 install
      # dies with "Failed to download checksum for the file 'Updates.xml'".
      # There is nothing to upgrade to: 3.3.0 is the latest aqtinstall release
      # and it is the one that fails. Measured 2026-10-28 - the nested path is
      # 200 for 6.8.3, 6.9.2 and 6.10.3, and 404 from 6.11.0 on.
      #
      # Only the version was wrong: `aqt list-qt windows desktop --arch 6.8.3`
      # confirms win64_msvc2022_64, and qtshadertools is in its module list.
      #
      # The UI being built against a different Qt minor than the NixOS build
      # is harmless - each platform's package is self-contained, which is the
      # same reason the .deb and .rpm are built per Qt line.
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          # qtdeclarative, qtsvg and qtshadertools are what nix/ui.nix pulls
          # in; keep this list and that one in step.
          modules: qtshadertools

      # Each pwsh step below reports its own failure as an annotation, for the
      # same reason the Linux jobs do: an annotation shows on the run summary
      # without opening the log, and the logs endpoint is 403 without a token
      # even on a public repository.
      - name: Build engine and UI
        shell: pwsh
        env:
          # cxx-qt interrogates ONE qmake for headers, libs and host tools.
          # On Windows the official Qt is already a single merged prefix, so
          # this needs none of the qt6.env machinery nix/ui.nix documents.
          CXXQT_QMAKE: ${{ env.QT_ROOT_DIR }}\bin\qmake.exe
        run: |
          function Fail($title, $text) {
            $t = (($text | Out-String) -replace "`r", '') -replace "`n", '%0A'
            Write-Output "::error title=$title::$t"
            exit 1
          }
          $log = cargo build --release -p nixdash-engine 2>&1
          if ($LASTEXITCODE -ne 0) { Fail 'cargo build nixdash-engine' ($log | Select-Object -Last 30) }
          $log = cargo build --release -p nixdash-ui 2>&1
          if ($LASTEXITCODE -ne 0) { Fail 'cargo build nixdash-ui' ($log | Select-Object -Last 40) }

      # windeployqt is what turns two .exe files into a payload: it walks the
      # UI's imports and copies the Qt DLLs, the platform and style plugins,
      # and - with --qmldir - the QML modules the app actually imports.
      - name: Stage the payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item target\release\nixdash-ui.exe     stage\
          Copy-Item target\release\nixdash-engine.exe stage\
          Copy-Item assets\nixdash.ico                stage\
          $log = & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --qmldir qml --release stage\nixdash-ui.exe 2>&1
          if ($LASTEXITCODE -ne 0) {
            $t = (($log | Out-String) -replace "`r", '') -replace "`n", '%0A'
            Write-Output "::error title=windeployqt::$t"
            exit 1
          }
          $log | Write-Output

      # Fail loudly rather than shipping an MSI whose shortcut points at a
      # UI that cannot start. A missing Qt6Qml.dll here means windeployqt
      # found no QML imports, which it reports as success.
      - name: Check the payload is complete
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @('nixdash-ui.exe','nixdash-engine.exe','Qt6Core.dll','Qt6Qml.dll','platforms\qwindows.dll')) {
            if (-not (Test-Path "stage\$f")) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            # List what IS there, since "Qt6Qml.dll missing" usually means
            # windeployqt found no QML imports rather than that Qt is broken.
            $have = (Get-ChildItem -Recurse -Name stage | Out-String) -replace "`r", ''
            Write-Output "::error title=payload incomplete::missing: $($missing -join ', ')%0A%0Astaged:%0A$($have -replace "`n", '%0A')"
            exit 1
          }

      - name: Build the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          # Version comes from the crate, so the MSI and the binary it
          # installs can never claim different versions.
          $v = (Select-String -Path engine\Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          wix build packaging\wix\nixdash.wxs -arch x64 -d Version=$v -d StageDir=stage -o nixdash-$v-x64.msi

      # Install the thing and run it. A Windows runner has a session, so the
      # UI can actually start - which is the only way to exercise the sibling
      # lookup in ui/src/engine_proc.rs and to find out whether windeployqt
      # collected every QML module. A missing one is not a link error; it is a
      # window that opens and draws nothing.
      #
      # /qn is silent and needs no elevation, because the package installs
      # per-user: see the Scope note in packaging/wix/nixdash.wxs.
      - name: Install it and run it
        shell: pwsh
        run: |
          # Annotations rather than `throw`: a thrown error gives the run
          # summary nothing but "exit code 1", which is exactly the hole the
          # third run fell into.
          function Fail($title, $text) {
            $t = (($text | Out-String) -replace "`r", '') -replace "`n", '%0A'
            Write-Output "::error title=$title::$t"
            exit 1
          }

          $msi = (Get-Item *.msi).FullName
          Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/l*v', 'install.log' -Wait -NoNewWindow

          $dir = "$env:LOCALAPPDATA\Programs\nixdash"
          if (-not (Test-Path $dir)) {
            Fail 'msiexec installed nothing' (Get-Content install.log -Tail 60)
          }
          $missing = @('nixdash-ui.exe','nixdash-engine.exe') | Where-Object { -not (Test-Path "$dir\$_") }
          if ($missing) {
            Fail "not installed: $($missing -join ', ')" (Get-ChildItem -Recurse -Name $dir)
          }

          # --spawn-engine, exactly as the Start Menu shortcut passes it.
          Start-Process "$dir\nixdash-ui.exe" -ArgumentList '--spawn-engine'
          $ok = $false
          foreach ($i in 1..60) {
            try { Invoke-RestMethod http://127.0.0.1:3100/health -TimeoutSec 2 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Milliseconds 500 }
          }
          # The engine answering proves the UI found nixdash-engine.exe beside
          # itself and started it - nothing else here is listening on 3100.
          if (-not $ok) {
            # What the UI left behind matters here: it may have started and
            # died on a missing Qt DLL, which looks identical from 3100.
            $procs = (Get-Process -Name nixdash-ui,nixdash-engine -ErrorAction SilentlyContinue |
                      Select-Object Name,Id | Out-String)
            Fail 'the UI did not bring up its engine on 3100' "running: $procs"
          }
          Invoke-RestMethod http://127.0.0.1:3100/health

      - uses: actions/upload-artifact@v4
        with:
          name: nixdash-msi
          path: "*.msi"
          if-no-files-found: error

      # Actions artifacts need a logged-in GitHub account to download and
      # they expire; a release asset is a plain public URL.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.msi"
          fail_on_unmatched_files: true
