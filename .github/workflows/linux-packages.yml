# Builds the .deb and the .rpm.
#
# These cannot be built on the development machine, and not for want of
# tooling: cargo-deb and dpkg are both in nixpkgs and run fine here. The
# problem is what they would package. A build on NixOS links against Qt and
# glibc in /nix/store - glibc 2.42, newer than any mainstream distribution
# ships - and a native package cannot reference /nix/store at all. So each
# package is built inside the distribution it targets, against that
# distribution's own Qt.
#
# Containers rather than runner images, deliberately. The glibc floor is the
# single most important property of these artifacts, and `debian:12` pins it
# at 2.36 for as long as the tag exists, where `ubuntu-22.04` is a moving
# target that GitHub retires on its own schedule.
#
#   debian:12   Qt 6.4.2, glibc 2.36  ->  Debian 12, Ubuntu 24.04 (Qt 6.4.2 too)
#   debian:13   Qt 6.8,   glibc 2.41  ->  Debian 13
#   fedora:41   Qt 6.8,   glibc 2.40  ->  Fedora 41
#
# One build per Qt MINOR, not one per glibc floor, and that is the reason
# debian:13 is here rather than being covered by the debian:12 build. cxx-qt
# links Qt's private API: readelf on nixdash-ui shows it requiring
# Qt_6_PRIVATE_API alongside Qt_6 and Qt_6.<minor>. That tag carries no
# version, and Qt does not promise private API stability across minor
# releases, so a binary built against 6.4.2 may fail at runtime on 6.8 while
# the shlibs dependency it carries is perfectly satisfied. Verified
# 2026-10-28; the engine, which links no Qt, has none of these tags.
#
# Both jobs install the package they just built, which is the only way to find
# out whether the dependencies named in ui/Cargo.toml actually exist in the
# archive under those names. A .deb that builds and cannot be installed is the
# failure mode worth catching here rather than in an issue report.
name: linux-packages

# For the release-asset upload at the end of each job; everything else here
# only needs the default read access.
permissions:
  contents: write

# Every `run:` is bash, said explicitly, because the container decides
# otherwise. Debian's /bin/sh is dash, and the install step's helpers are
# full of bashisms - ${var//a/b}, $'\n', local, and a trap on ERR, which dash
# rejects outright with "trap: ERR: bad trap". Under -e that aborted the step
# immediately: check.log was created and left empty, nothing was installed,
# and the failure looked identical to the one being investigated. Runs three
# through seven all died there. Fedora's /bin/sh is bash, which is the whole
# reason the rpm job passed the same code.
defaults:
  run:
    shell: bash

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            suffix: debian12
          - image: debian:13
            suffix: debian13
    container: ${{ matrix.image }}
    steps:
      # Before checkout: actions/checkout needs git, and the container has none.
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-shadertools-dev \
            libgl1-mesa-dev desktop-file-utils

      - uses: actions/checkout@v4

      # Debian 12 ships Rust 1.63, too old for this workspace.
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          # cxx-qt interrogates ONE qmake for headers, libs and host tools.
          # Debian's Qt is already a single merged prefix, so none of the
          # qt6.env machinery that nix/ui.nix needs applies here.
          CXXQT_QMAKE: /usr/bin/qmake6
        run: cargo build --release -p nixdash-engine -p nixdash-ui

      - name: Package
        run: |
          cargo install cargo-deb --locked
          # --no-build: both binaries are already built above, and cargo-deb
          # would otherwise build only the UI crate it was pointed at.
          # --variant caps the Qt dependency at this build's minor, so
          # installing it on the wrong Qt line is refused by apt rather than
          # misbehaving at runtime. See ui/Cargo.toml.
          cargo deb -p nixdash-ui --no-build --variant ${{ matrix.suffix }}
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          # Self-describing filename: the two .deb files are not
          # interchangeable, so the user must be able to tell them apart from
          # the download page alone.
          for f in target/debian/*.deb; do
            mv "$f" "target/debian/nixdash_${GITHUB_REF_NAME#v}_${{ matrix.suffix }}_amd64.deb"
          done
          ls -la target/debian/

      # apt, not dpkg -i: apt resolves the dependencies, so a QML module named
      # wrongly in ui/Cargo.toml fails here instead of at first launch.
      - name: Install it, and check the engine runs
        run: |
          # Surface failures as annotations. They appear on the run summary
          # without opening the log, which is also the only way to read why a
          # job failed without an authenticated token on a public repo - the
          # logs endpoint is 403 anonymously. Newlines must be %0A encoded.
          # Two annotations, and the sanitising, both exist because the
          # fourth run failed with no annotation at all: the engine's log
          # carries ANSI colour escapes, and an escape inside a workflow
          # command makes GitHub drop the whole line - so the message was
          # emitted and silently discarded. The bare one can always be
          # parsed; the second carries the detail.
          #
          # % must be encoded before the newlines are, or the %0A introduced
          # here would itself be re-encoded to %250A.
          ann() {
            local title=$1 body=$2
            printf '::error::%s\n' "$title"
            body=$(printf '%s' "$body" | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g')
            body=${body//'%'/%25}
            body=${body//$'\r'/%0D}
            body=${body//$'\n'/%0A}
            printf '::error title=%s::%s\n' "$title" "$body"
          }
          run() {
            local out
            if ! out=$("$@" 2>&1); then ann "$1" "$out"; exit 1; fi
            printf '%s\n' "$out"
          }

          # A trap, because wrapping individual commands is not enough: the
          # third run of this failed with exit 1 and produced no annotation
          # at all, which means the failing line was one `run` did not cover.
          # ERR fires for any of them and reports the line number, so the next
          # failure names itself whatever it is.
          trap 'rc=$?; ann "step failed (line $LINENO, exit $rc)" "$(tail -n 20 engine.log 2>/dev/null)"' ERR

          run apt-get install -y ./target/debian/*.deb
          run test -x /usr/bin/nixdash-ui
          run test -f /usr/lib/systemd/user/nixdash-engine.service
          run test -f /usr/share/applications/nixdash.desktop
          run desktop-file-validate /usr/share/applications/nixdash.desktop

          NO_COLOR=1 NIXDASH_PORT=3100 /usr/bin/nixdash-engine >engine.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3100/health >/dev/null && break || sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:3100/health; then
            ann 'the installed engine never answered on 3100' "$(cat engine.log)"
            exit 1
          fi

          # Two panels that only a packaged install can get wrong, and that
          # nothing else here would notice. Running the published 0.1.0 .deb
          # on Debian 12 showed qt-runtime reporting "the desktop UI is not
          # installed" while the UI sat beside the engine saying it - it knew
          # only Nix profile paths - and disk reporting unknown because it
          # hardcoded /nix. Both panels answer; both answered wrongly. The
          # engine starting proves neither.
          panels=$(curl -sf --max-time 10 http://127.0.0.1:3100/api/panels)
          if grep -q 'the desktop UI is not installed' <<<"$panels"; then
            ann 'qt-runtime cannot see the installed UI' \
                "$(grep -o '"id":"qt-runtime".\{0,300\}' <<<"$panels")"
            exit 1
          fi
          if grep -q '/nix: No such file or directory' <<<"$panels"; then
            ann 'disk is still looking for a Nix store' \
                "$(grep -o '"id":"disk".\{0,300\}' <<<"$panels")"
            exit 1
          fi
          echo 'panels ok: qt-runtime sees the UI, disk measures a real filesystem'
          kill %1

      # The one test that cannot be run on the development machine at all:
      # CLAUDE.md forbids putting the window on the author's screen, and the
      # sibling lookup in ui/src/engine_proc.rs is only exercised by actually
      # launching the installed UI. A container has no screen to invade.
      #
      # This is also the only check that the QML dependencies are complete:
      # a missing qml6-module-* is not a link error, it is a window that opens
      # and draws nothing, so it cannot be caught by dpkg or by the linker.
      - name: The UI starts, finds its sibling engine, and loads its QML
        run: |
          # xauth as well as xvfb: xvfb-run shells out to it to write the
          # auth cookie, and --no-install-recommends leaves it out, so the
          # ninth run got "xvfb-run: error: xauth command not found" and no
          # UI at all. Keeping --no-install-recommends and naming the one
          # thing actually needed, rather than pulling in the recommends set.
          apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a /usr/bin/nixdash-ui --spawn-engine >ui.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/health >/dev/null && break || sleep 0.5
          done
          # The engine answering proves the UI located nixdash-engine beside
          # itself and started it; nothing else on this machine is listening.
          curl -sf http://127.0.0.1:3100/health
          # A QML failure leaves a running process and an empty window, so the
          # log is the only place it shows up.
          # Match what a QML failure actually says, not the substring "qml".
          # The previous pattern was `qml|QQmlApplicationEngine|is not a type`
          # case-insensitively, so any ordinary Qt startup line mentioning qml
          # failed the step - and because this step collected nothing, there
          # was no way to tell a real error from that.
          #
          # These three are the signatures that matter: the engine giving up
          # on the root component, a module the QML engine cannot resolve, and
          # a type it cannot resolve.
          if grep -qE 'QQmlApplicationEngine failed to load component|is not installed|is not a type' ui.log; then
            echo '--- QML errors:'
            cat ui.log
            exit 1
          fi
          echo 'UI started, engine answered, no QML errors in its log'

      - uses: actions/upload-artifact@v4
        with:
          # The distro is in the artifact name because the two .deb files are
          # NOT interchangeable, despite both being .deb: see the note on
          # Qt_6_PRIVATE_API at the top.
          name: nixdash-${{ matrix.suffix }}
          path: target/debian/*.deb
          if-no-files-found: error

      # Actions artifacts are only downloadable by a logged-in GitHub user and
      # they expire. A release asset is a plain public URL, which is the whole
      # point of building these.


      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb
          fail_on_unmatched_files: true

  rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Build dependencies
        run: |
          dnf install -y \
            git curl gcc gcc-c++ make pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel \
            qt6-qtshadertools-devel mesa-libGL-devel

      - uses: actions/checkout@v4

      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          CXXQT_QMAKE: /usr/bin/qmake6
        run: cargo build --release -p nixdash-engine -p nixdash-ui

      - name: Package
        run: |
          cargo install cargo-generate-rpm --locked
          # cargo-deb strips the binaries it recognises as Cargo artifacts;
          # cargo-generate-rpm has no equivalent, so do it here or ship ~2 MB
          # of symbols. Measured on the .deb: 4.58 MB -> 3.49 MB for the
          # engine, 3.60 MB -> 2.77 MB for the UI.
          strip target/release/nixdash-engine target/release/nixdash-ui
          # --auto-req overrides the "auto" in ui/Cargo.toml with a filtered
          # find-requires; see packaging/linux/find-requires-filtered for the
          # one soname it drops and why the rpm is uninstallable without it.
          # Kept on the command line rather than in the manifest so that
          # generating an rpm on a non-Fedora machine, which has no
          # /usr/lib/rpm/find-requires, still works for checking the layout.
          cargo generate-rpm -p ui --auto-req ./packaging/linux/find-requires-filtered
          rpm -qip target/generate-rpm/*.rpm
          rpm -qlp target/generate-rpm/*.rpm
          for f in target/generate-rpm/*.rpm; do
            mv "$f" "target/generate-rpm/nixdash-${GITHUB_REF_NAME#v}-fedora41.x86_64.rpm"
          done

      - name: Install it, and check the engine runs
        run: |
          # Surface failures as annotations. They appear on the run summary
          # without opening the log, which is also the only way to read why a
          # job failed without an authenticated token on a public repo - the
          # logs endpoint is 403 anonymously. Newlines must be %0A encoded.
          # Two annotations, and the sanitising, both exist because the
          # fourth run failed with no annotation at all: the engine's log
          # carries ANSI colour escapes, and an escape inside a workflow
          # command makes GitHub drop the whole line - so the message was
          # emitted and silently discarded. The bare one can always be
          # parsed; the second carries the detail.
          #
          # % must be encoded before the newlines are, or the %0A introduced
          # here would itself be re-encoded to %250A.
          ann() {
            local title=$1 body=$2
            printf '::error::%s\n' "$title"
            body=$(printf '%s' "$body" | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g')
            body=${body//'%'/%25}
            body=${body//$'\r'/%0D}
            body=${body//$'\n'/%0A}
            printf '::error title=%s::%s\n' "$title" "$body"
          }
          run() {
            local out
            if ! out=$("$@" 2>&1); then ann "$1" "$out"; exit 1; fi
            printf '%s\n' "$out"
          }

          # A trap, because wrapping individual commands is not enough: the
          # third run of this failed with exit 1 and produced no annotation
          # at all, which means the failing line was one `run` did not cover.
          # ERR fires for any of them and reports the line number, so the next
          # failure names itself whatever it is.
          trap 'rc=$?; ann "step failed (line $LINENO, exit $rc)" "$(tail -n 20 engine.log 2>/dev/null)"' ERR

          run dnf install -y ./target/generate-rpm/*.rpm
          run test -x /usr/bin/nixdash-ui
          run test -f /usr/lib/systemd/user/nixdash-engine.service

          NO_COLOR=1 NIXDASH_PORT=3100 /usr/bin/nixdash-engine >engine.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3100/health >/dev/null && break || sleep 0.5
          done
          if ! curl -sf http://127.0.0.1:3100/health; then
            ann 'the installed engine never answered on 3100' "$(cat engine.log)"
            exit 1
          fi

          # Two panels that only a packaged install can get wrong, and that
          # nothing else here would notice. Running the published 0.1.0 .deb
          # on Debian 12 showed qt-runtime reporting "the desktop UI is not
          # installed" while the UI sat beside the engine saying it - it knew
          # only Nix profile paths - and disk reporting unknown because it
          # hardcoded /nix. Both panels answer; both answered wrongly. The
          # engine starting proves neither.
          panels=$(curl -sf --max-time 10 http://127.0.0.1:3100/api/panels)
          if grep -q 'the desktop UI is not installed' <<<"$panels"; then
            ann 'qt-runtime cannot see the installed UI' \
                "$(grep -o '"id":"qt-runtime".\{0,300\}' <<<"$panels")"
            exit 1
          fi
          if grep -q '/nix: No such file or directory' <<<"$panels"; then
            ann 'disk is still looking for a Nix store' \
                "$(grep -o '"id":"disk".\{0,300\}' <<<"$panels")"
            exit 1
          fi
          echo 'panels ok: qt-runtime sees the UI, disk measures a real filesystem'
          kill %1

      # See the long note on the equivalent step in the deb job.
      - name: The UI starts, finds its sibling engine, and loads its QML
        run: |
          dnf install -y xorg-x11-server-Xvfb
          xvfb-run -a /usr/bin/nixdash-ui --spawn-engine >ui.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/health >/dev/null && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:3100/health
          # Match what a QML failure actually says, not the substring "qml".
          # The previous pattern was `qml|QQmlApplicationEngine|is not a type`
          # case-insensitively, so any ordinary Qt startup line mentioning qml
          # failed the step - and because this step collected nothing, there
          # was no way to tell a real error from that.
          #
          # These three are the signatures that matter: the engine giving up
          # on the root component, a module the QML engine cannot resolve, and
          # a type it cannot resolve.
          if grep -qE 'QQmlApplicationEngine failed to load component|is not installed|is not a type' ui.log; then
            echo '--- QML errors:'
            cat ui.log
            exit 1
          fi
          echo 'UI started, engine answered, no QML errors in its log'

      - uses: actions/upload-artifact@v4
        with:
          name: nixdash-rpm
          path: target/generate-rpm/*.rpm
          if-no-files-found: error



      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/generate-rpm/*.rpm
          fail_on_unmatched_files: true
