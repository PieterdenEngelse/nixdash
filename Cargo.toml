[workspace]
members = ["engine", "ui"]
# Built by corrosion for wasm32-unknown-emscripten, never for the host.
exclude = ["ui-wasm/rust"]
resolver = "2"

# The one place the version is written. Five places held it before - both
# crate manifests and the three Nix derivations - so cutting 0.1.1 meant
# editing five files, and missing one would have shipped a package under
# the wrong version. The crates inherit it with `version.workspace = true`; the Nix
# derivations read this file.
[workspace.package]
version = "0.1.1"
